services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: vibelib
      POSTGRES_USER: vibelib
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # A named volume rather than a bind mount to a host path. Under rootless podman
    # the container's postgres user (uid 999) is a different uid on the host than
    # the one that owns a directory we created, so a bind mount needs an out-of-band
    # `podman unshare chown` to be writable at all. A named volume is created with
    # the right ownership by the container engine, on both podman and docker, so the
    # same compose file works on the laptop and the server with nothing to remember.
    #
    # Nothing is lost by not having the files on the host: a Postgres data directory
    # cannot be copied between machines of different architectures anyway. Backups
    # and migrations go through pg_dump (util/dump.sh), which is portable.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibelib"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../python/web
      dockerfile: ../../docker/web/Dockerfile
    restart: unless-stopped
    # All interfaces, because Caddy runs in its own container and reaches this over
    # the podman gateway address rather than loopback. What keeps the port private
    # is the host firewall: only 22, 80 and 443 are open, so 8000 is reachable from
    # the proxy and from nowhere else.
    #
    # That matters, because this port is the app without TLS. The session cookie is
    # Secure, so a browser arriving over plain http could not log in -- but /api and
    # /download would serve anyone who got through.
    ports:
      - "8000:8000"
    environment:
      PGHOST: db
      PGDATABASE: vibelib
      PGUSER: vibelib
      PGPASSWORD: ${POSTGRES_PASSWORD}
      WEB_COVERS_DIR: /covers
      OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY}
      OBJECT_STORE_BUCKET_NAME: ${OBJECT_STORE_BUCKET_NAME}
      OBJECT_STORE_BUCKET_ENDPOINT: ${OBJECT_STORE_BUCKET_ENDPOINT}
      OBJECT_STORE_BUCKET_REGION: ${OBJECT_STORE_BUCKET_REGION}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET}
      OAUTH_SESSION_SECRET: ${OAUTH_SESSION_SECRET}
      # Where the app is reachable from a browser, which is what the OAuth redirect
      # is built from. Unset means local dev; production must set it in .env to the
      # public origin, and that value must match a redirect URI registered on the
      # OAuth client in the Google Cloud console.
      OAUTH_BASE_URL: ${OAUTH_BASE_URL:-http://localhost:8000}
      # Local development only: skip Google and treat every request as this user.
      # The app refuses to start if this is set while OAUTH_BASE_URL is https.
      OAUTH_DEV_USER: ${OAUTH_DEV_USER:-}
    volumes:
      - ../../data/covers:/covers:ro
    depends_on:
      db:
        condition: service_healthy

  # The pre-vibelib library database, restored from old-library-mysql-backup.sql
  # so its data (notably assets.acq_date) can be mined. Read-only reference, not
  # part of the running system — hence the profile:
  #   docker compose up -d legacy-db
  legacy-db:
    image: mariadb:10.11
    profiles: ["legacy"]
    environment:
      MARIADB_ROOT_PASSWORD: ${LEGACY_DB_PASSWORD:-legacy}
      MARIADB_DATABASE: library
    ports:
      - "3306:3306"
    volumes:
      - ../../data/mariadb:/var/lib/mysql
      # Loaded automatically, but only on first start (empty data dir).
      - ../../old-library-mysql-backup.sql:/docker-entrypoint-initdb.d/01-library.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60

  # On-demand tool, not a long-running service:
  #   docker compose run --rm loader scan
  #   docker compose run --rm loader load [--limit N] [--dry-run] [--type epub|m4b]
  # Mounts covers read-write (web and resolver only read them): the loader
  # extracts cover art to /covers/<type>/<id>.jpg as it ingests.
  loader:
    build:
      context: ../python/loader
      dockerfile: ../../docker/loader/Dockerfile
    profiles: ["tools"]
    environment:
      PGHOST: db
      PGDATABASE: vibelib
      PGUSER: vibelib
      PGPASSWORD: ${POSTGRES_PASSWORD}
      LOADER_COVERS_DIR: /covers
      OBJECT_STORE_ACCESS_KEY_ID: ${OBJECT_STORE_ACCESS_KEY_ID}
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY}
      OBJECT_STORE_BUCKET_NAME: ${OBJECT_STORE_BUCKET_NAME}
      OBJECT_STORE_BUCKET_ENDPOINT: ${OBJECT_STORE_BUCKET_ENDPOINT}
      OBJECT_STORE_BUCKET_REGION: ${OBJECT_STORE_BUCKET_REGION}
    volumes:
      - ../../data/covers:/covers
    depends_on:
      db:
        condition: service_healthy

  # On-demand tool, not a long-running service:
  #   docker compose run --rm resolver resolve [--limit N] [--dry-run] [--asset epub:123]
  #   docker compose run --rm resolver review list
  resolver:
    build:
      context: ../python/resolver
      dockerfile: ../../docker/resolver/Dockerfile
    profiles: ["tools"]
    environment:
      PGHOST: db
      PGDATABASE: vibelib
      PGUSER: vibelib
      PGPASSWORD: ${POSTGRES_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      RESOLVER_MODEL: ${RESOLVER_MODEL:-claude-sonnet-5}
      RESOLVER_COVERS_DIR: /covers
    volumes:
      - ../../data/covers:/covers:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  # The library's curated metadata. The only copy that matters is the one
  # util/dump.sh writes -- see the note on the db service above.
  pgdata:
