<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vibelib &mdash; sign in</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="login">
    <h1 class="brand login-brand">vibelib</h1>
    <p class="login-sub">A private library. Sign in to browse it.</p>

    <a id="signin" class="google-btn" href="/auth/login">
      <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92a8.78 8.78 0 0 0 2.68-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.02-3.7H.96v2.34A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.98 10.72a5.4 5.4 0 0 1 0-3.44V4.94H.96a9 9 0 0 0 0 8.12l3.02-2.34z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.94l3.02 2.34C4.68 5.16 6.66 3.58 9 3.58z"/>
      </svg>
      Continue with Google
    </a>

    <p id="error" class="login-error" hidden></p>
  </main>

  <script>
    const params = new URLSearchParams(location.search);

    // Carry the originally-requested page through the handshake, so someone who
    // followed a link to a book lands on that book rather than the front page.
    const next = params.get('next');
    if (next && next.startsWith('/') && !next.startsWith('//')) {
      document.getElementById('signin').href = `/auth/login?next=${encodeURIComponent(next)}`;
    }

    const MESSAGES = {
      denied: "That Google account isn't on the guest list. Ask Mike for an invitation.",
      unverified: "Google hasn't verified that email address, so it can't be used to sign in.",
      failed: 'That sign-in didn’t go through. Give it another try.',
    };
    const message = MESSAGES[params.get('error')];
    if (message) {
      const el = document.getElementById('error');
      el.textContent = message;
      el.hidden = false;
    }
  </script>
</body>
</html>
