[project]
name = "vibelib-web"
version = "0.1.0"
description = "Web UI and JSON API for browsing the library"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["web"]

[tool.setuptools.package-data]
web = ["static/*"]
