[project]
name = "vibelib-web"
version = "0.1.0"
description = "Web UI and JSON API for browsing the library"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "boto3>=1.34",
    "authlib>=1.3",        # OAuth/OIDC client: the Google handshake, and verifying what comes back
    "httpx>=0.27",         # what authlib's starlette client makes its token calls with
    "itsdangerous>=2.2",   # signs the session cookie for starlette's SessionMiddleware
    "pydantic[email]>=2",  # EmailStr, so a typo'd invitation is rejected rather than un-redeemable
    "python-multipart>=0.0.9",  # what FastAPI parses an uploaded file out of
    "mutagen>=1.47",       # m4b tags and cover art (chapters come from ffprobe)
    "anthropic>=0.60",     # resolving a new asset to a book -- see web/ingest
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["web", "web.ingest"]

[tool.setuptools.package-data]
web = ["static/*"]
