[project]
name = "vibelib-resolver"
version = "0.1.0"
description = "Resolves raw epub/m4b assets to abstract books, people, and series"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.60",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
resolver = "resolver.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["resolver"]
