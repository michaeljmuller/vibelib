[project]
name = "vibelib-loader"
version = "0.1.0"
description = "Ingests new epub/m4b objects from the object store into the raw asset tables"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "mutagen>=1.47",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
loader = "loader.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["loader"]
